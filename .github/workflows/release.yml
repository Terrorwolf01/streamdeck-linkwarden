name: Release

# Fires on a version tag, e.g. `v1.0.0`. assets/manifest.json's "Version" is 4-part
# (Windows-style, e.g. "1.0.0.0") - only its first three components need to match the tag, since
# that 4th number doesn't carry meaning for a release tag. Bump the manifest's Version alongside
# the tag, or this fails before building anything.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check tag matches manifest version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          # Compare against only the first three components of manifest.json's 4-part Version -
          # the tag doesn't carry that trailing number.
          manifest_version=$(jq -r '.Version' assets/manifest.json | cut -d. -f1-3)
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $tag_version) doesn't match assets/manifest.json's Version ($manifest_version.x)."
            exit 1
          fi

      - name: Determine build targets
        id: targets
        run: |
          targets=$(jq -r '.CodePaths | keys | join(",")' assets/manifest.json)
          echo "targets=$targets" >>"$GITHUB_OUTPUT"

      - name: Install Rust targets
        run: |
          IFS=',' read -ra targets <<<"${{ steps.targets.outputs.targets }}"
          for target in "${targets[@]}"; do
            rustup target add "$target"
          done

      - name: Install mingw-w64
        if: contains(steps.targets.outputs.targets, 'windows')
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install PI dependencies
        working-directory: pi
        run: deno install

      - name: Package plugin
        run: ./package.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.streamDeckPlugin --title "$GITHUB_REF_NAME" --generate-notes