name: Release

# Fires on a version tag, e.g. `v0.1.0` or `v0.1.0.0` (matching assets/manifest.json's 4-part
# Windows-style version field). The tag's version (minus the leading "v") must match manifest.json's
# "Version" - bump that alongside the tag, or this fails before building anything.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version=$(jq -r '.Version' assets/manifest.json)
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $tag_version) doesn't match assets/manifest.json's Version ($manifest_version)."
            exit 1
          fi

      - name: Determine build targets
        id: targets
        run: |
          targets=$(jq -r '.CodePaths | keys | join(",")' assets/manifest.json)
          echo "targets=$targets" >>"$GITHUB_OUTPUT"

      - name: Install Rust targets
        run: |
          IFS=',' read -ra targets <<<"${{ steps.targets.outputs.targets }}"
          for target in "${targets[@]}"; do
            rustup target add "$target"
          done

      - name: Install mingw-w64
        if: contains(steps.targets.outputs.targets, 'windows')
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Package plugin
        run: ./package.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.streamDeckPlugin --title "$GITHUB_REF_NAME" --generate-notes