[package]
name = "linkwarden"
edition = "2024"

[dependencies]
openaction = "2.7"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
simplelog = "0.12"
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde_json = "1.0.151"


[patch.crates-io]
openaction = { git = 'https://github.com/OpenActionAPI/rust.git' }